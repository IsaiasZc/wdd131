<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form – WDD 131">
    <meta name="author" content="Isaias Zuniga">
    <title>Product Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
  </head>
  <body>

    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html">

        <!-- Product Name -->
        <div class="field">
          <label for="productName">Product Name</label>
          <select id="productName" name="productName" required>
            <option value="" disabled selected>Choose a Product ...</option>
          </select>
        </div>

        <!-- Overall Rating -->
        <div class="field">
          <fieldset>
            <legend>Overall Rating</legend>
            <div class="rating-options">
              <label>
                &#9734;
                <input type="radio" name="rating" value="1" required>
              </label>
              <label>
                &#9734;&#9734;
                <input type="radio" name="rating" value="2">
              </label>
              <label>
                &#9734;&#9734;&#9734;
                <input type="radio" name="rating" value="3">
              </label>
              <label>
                &#9734;&#9734;&#9734;&#9734;
                <input type="radio" name="rating" value="4">
              </label>
              <label>
                &#9734;&#9734;&#9734;&#9734;&#9734;
                <input type="radio" name="rating" value="5">
              </label>
            </div>
          </fieldset>
        </div>

        <!-- Date of Installation -->
        <div class="field">
          <label for="installDate">Date of Installation</label>
          <input type="date" id="installDate" name="installDate" required>
        </div>

        <!-- Useful Features -->
        <div class="field">
          <fieldset>
            <legend>
              Which features did you find useful in the product?<br>
              <em>(Check all that apply)</em>
            </legend>
            <div class="checkbox-group">
              <label>
                <input type="checkbox" name="features" value="Durability">
                Durability
              </label>
              <label>
                <input type="checkbox" name="features" value="Ease of Use">
                Ease of Use
              </label>
              <label>
                <input type="checkbox" name="features" value="Performance">
                Performance
              </label>
              <label>
                <input type="checkbox" name="features" value="Design">
                Design
              </label>
            </div>
          </fieldset>
        </div>

        <!-- Written Review -->
        <div class="field">
          <label for="writtenReview">
            Written Review <span class="optional">(Optional)</span>
          </label>
          <textarea id="writtenReview" name="writtenReview"></textarea>
        </div>

        <!-- Your Name -->
        <div class="field">
          <label for="userName">
            Your Name <span class="optional">(Optional)</span>
          </label>
          <input type="text" id="userName" name="userName">
        </div>

        <!-- Submit -->
        <input type="submit" value="Post Review">

      </form>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Isaias Zuniga &mdash; Lima, Per&uacute;</p>
      <p id="lastModified"></p>
    </footer>

  </body>
</html>
